<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,body{margin:0;height:100%;background:#020617;color:white;font-family:system-ui}
    video{object-fit:cover;background:#0f172a;width:100%;height:100%}
    #local{border-radius:12px}#remote{position:absolute;inset:0}
    #waiting{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#94a3b8}
    .radar{border:3px solid #334155;border-top-color:#10b981;border-radius:50%;width:48px;height:48px;margin:auto;animation:spin 1.5s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #pip{position:absolute;right:12px;bottom:12px;width:30%;height:28%;border:1px solid #475569;border-radius:12px;overflow:hidden}
    body.preview #pip{inset:0;width:100%;height:100%;border:0}body.preview #waiting{display:none}
    #meter{position:absolute;bottom:4px;left:8px;right:8px;height:5px;background:#334155}
    #level{height:100%;width:0;background:#10b981}
  </style>
</head>
<body class="preview">
  <video id="remote" autoplay playsinline></video>
  <div id="waiting"><div class="radar"></div><p>Waiting for your doctor's camera</p></div>
  <div id="pip"><video id="local" autoplay muted playsinline></video><div id="meter"><div id="level"></div></div></div>
  <audio id="audio" autoplay></audio>
  <script>/*SDK*/</script>
  <script>
    const send=(type,value)=>Telehealth.postMessage(JSON.stringify({type,value}));
    let session,devices,stream,ctx,frame,muted=false,camera=true,ending=false,remoteId;
    let videoInputs=[],videoIndex=0;
    const local=document.getElementById('local'),remote=document.getElementById('remote');

    async function stopPreview(){
      cancelAnimationFrame(frame);
      if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
      if(ctx){await ctx.close();ctx=null;}
      local.srcObject=null;
    }

    async function preview(){
      await stopPreview();
      stream=await navigator.mediaDevices.getUserMedia({audio:true,video:{facingMode:'user'}});
      local.srcObject=stream;
      await local.play().catch(()=>{});
      ctx=new AudioContext();await ctx.resume();
      const analyser=ctx.createAnalyser();ctx.createMediaStreamSource(stream).connect(analyser);
      const samples=new Uint8Array(analyser.fftSize);
      function tick(){
        analyser.getByteTimeDomainData(samples);let sum=0;
        for(const v of samples)sum+=((v-128)/128)**2;
        document.getElementById('level').style.width=Math.min(100,Math.sqrt(sum/samples.length)*400)+'%';
        frame=requestAnimationFrame(tick);
      }
      tick();send('ready',true);
    }

    async function startSelectedVideo(av){
      videoInputs=await av.listVideoInputDevices();
      if(!videoInputs.length)throw new Error('No camera was found');
      videoIndex=Math.min(videoIndex,videoInputs.length-1);
      await av.startVideoInput(videoInputs[videoIndex].deviceId);
    }

    async function join(data){
      await stopPreview();ending=false;document.body.classList.remove('preview');
      const logger=new ChimeSDK.ConsoleLogger('Telehealth',ChimeSDK.LogLevel.ERROR);
      devices=new ChimeSDK.DefaultDeviceController(logger);
      session=new ChimeSDK.DefaultMeetingSession(
        new ChimeSDK.MeetingSessionConfiguration(data.meeting,data.attendee),logger,devices);
      const av=session.audioVideo;
      av.addObserver({
        audioVideoDidStart(){send('connected',true);},
        audioVideoDidStartConnecting(reconnecting){send('status',reconnecting?'Reconnecting…':'Connecting…');},
        audioVideoDidStop(status){if(!ending)send('error','Call disconnected ('+status.statusCode()+'). Leave and join again.');},
        videoTileDidUpdate(tile){
          if(!tile.tileId||!tile.boundAttendeeId||tile.isContent)return;
          if(tile.localTile){av.bindVideoElement(tile.tileId,local);void local.play().catch(()=>{});}
          else{remoteId=tile.tileId;av.bindVideoElement(tile.tileId,remote);void remote.play().catch(()=>{});document.getElementById('waiting').style.display=tile.active?'none':'grid';}
        },
        videoTileWasRemoved(id){if(id===remoteId){remoteId=null;document.getElementById('waiting').style.display='grid';}}
      });
      await av.bindAudioElement(document.getElementById('audio'));
      await av.startAudioInput('default');
      av.chooseVideoInputQuality(640,360,15);
      await startSelectedVideo(av);
      av.realtimeSubscribeToVolumeIndicator(data.attendee.AttendeeId,(_,volume)=>{
        document.getElementById('level').style.width=(muted?0:(volume||0)*100)+'%';
      });
      av.start();
      const localTileId=av.startLocalVideoTile();
      av.bindVideoElement(localTileId,local);
      await local.play().catch(()=>{});
      send('ready',true);
    }

    async function command(name){
      const av=session?.audioVideo;
      if(name==='mic'){
        muted=!muted;
        if(av){muted?av.realtimeMuteLocalAudio():av.realtimeUnmuteLocalAudio();}
        else stream?.getAudioTracks().forEach(t=>t.enabled=!muted);
        send('mic',muted);
      }
      if(name==='camera'){
        camera=!camera;
        if(av){
          if(camera){await startSelectedVideo(av);const id=av.startLocalVideoTile();av.bindVideoElement(id,local);await local.play().catch(()=>{});}
          else{av.stopLocalVideoTile();await av.stopVideoInput();}
        }else stream?.getVideoTracks().forEach(t=>t.enabled=camera);
        send('camera',camera);
      }
      if(name==='switch'){
        if(av&&camera&&videoInputs.length>1){videoIndex=(videoIndex+1)%videoInputs.length;await av.startVideoInput(videoInputs[videoIndex].deviceId);}
        else if(!av){await preview();stream.getAudioTracks().forEach(t=>t.enabled=!muted);stream.getVideoTracks().forEach(t=>t.enabled=camera);}
      }
    }

    async function leave(){
      ending=true;await stopPreview();
      if(session){session.audioVideo.stop();await devices.stopAudioInput();await devices.stopVideoInput();await session.destroy();session=null;}
      send('left',true);
    }
    window.telehealth={
      preview:()=>preview().catch(()=>send('error','Camera or microphone unavailable. Check permissions and retry.')),
      join:d=>join(d).catch(error=>send('error','Unable to connect video: '+(error?.message||'unknown error'))),
      command:n=>command(n).catch(()=>send('error','Unable to change media device.')),
      leave
    };
    window.addEventListener('pagehide',()=>{void leave();});send('loaded',true);
  </script>
</body>
</html>
